<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Quiz Monumenti di Roma (VR) | Lost in Rome</title>

    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link rel="icon" type="image-png" href="/src/resources/images/loghi/logoLostInRome_icona.png">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link href="/src/plugins/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/src/plugins/slick/slick.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/src/css/style.css" rel="stylesheet">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
    :root {
      --turchese: #068D9D;
      --turchese-scuro: #056974;
      --marrone: #6b522a;
      --marrone-chiaro: #7a6a5f;
      --beige: #FFFCF5;
    }

    body.vr-page-body {
      background-color: var(--beige);
      color: var(--marrone);
      font-family: 'Lexend', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .vr-main-content {
      flex-grow: 1;
      padding: 30px 0;
      padding-top: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .vr-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
      text-align: center;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(107, 82, 42, 0.1);
    }

    .vr-title {
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--marrone);
      margin-bottom: 20px;
    }

    .vr-description {
      font-size: 1.1rem;
      color: var(--marrone-chiaro);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .vr-buttons-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .vr-btn {
      background-color: var(--turchese);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .vr-btn:hover {
      background-color: var(--turchese-scuro);
      transform: translateY(-2px);
      color: white;
    }

    .vr-btn i {
      font-size: 1.2rem;
    }

    .vr-display-area {
      width: 100%;
      height: 400px;
      background-color: #f0f0f0;
      border-radius: 8px;
      margin-top: 30px;
      overflow: hidden;
      position: relative;
    }

    .back-to-quiz-btn {
      background-color: var(--marrone-chiaro);
      margin-top: 40px;
      padding: 10px 20px;
    }

    .back-to-quiz-btn:hover {
      background-color: var(--marrone);
    }

    /* Stili per il pannello del quiz in VR */
    #quiz-panel {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        display: none; /* Inizialmente nascosto */
        z-index: 100;
    }
    #quiz-question {
        font-size: 1.2rem;
        color: var(--marrone);
        margin-bottom: 15px;
    }
    .quiz-option {
        background-color: var(--beige);
        border: 1px solid var(--marrone-chiaro);
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .quiz-option:hover {
        background-color: var(--turchese);
        color: white;
    }
  </style>
</head>
<body class="vr-page-body">
<div id="headerPlaceHolder"></div>

<div class="vr-main-content">
    <div class="vr-container">
        <p class="vr-description">Preparati ad un Quiz immersivo sulla Città Eterna!</p>


        <div class="vr-display-area">
            <a-scene embedded style="width: 100%; height: 100%;" id="vr-scene">
                <a-assets>
                    <img id="sky" src="https://raw.githubusercontent.com/aframevr/aframe/v1.5.0/examples/boilerplate/assets/sky.jpg">
                </a-assets>

                <a-sky src="#sky"></a-sky>

                <a-entity camera look-controls wasd-controls position="0 1.6 0">
                    <a-entity cursor="rayOrigin: mouse; fuse: false;"
                              position="0 0 -1"
                              geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                              material="color: black; shader: flat; opacity: 0.5">
                    </a-entity>
                </a-entity>

                <a-box id="quiz-hotspot" position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9"
                       scale="0.5 0.5 0.5"
                       event-set__enter="material.color: #EF2D5E"
                       event-set__leave="material.color: #4CC3D9"
                       class="interactive-element"></a-box>
                <a-text value="Clicca per il quiz!" position="0 1.8 -3" align="center" color="white" width="2"></a-text>

            </a-scene>
            <div id="quiz-panel">
                <h3 id="quiz-question">Domanda del Quiz VR</h3>
                <div id="quiz-options-vr">
                    <div class="quiz-option">Opzione A</div>
                    <div class="quiz-option">Opzione B</div>
                    <div class="quiz-option">Opzione C</div>
                </div>
            </div>
        </div>

        <a href="quiz.html" class="vr-btn back-to-quiz-btn">
            <i class="fas fa-arrow-left"></i> Torna al Quiz Standard
        </a>

    </div>
</div>

<div id="footerPlaceHolder"></div>

<script src="/src/plugins/jQuery/jquery.min.js"></script>
<script src="/src/plugins/bootstrap/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/src/plugins/masonry/masonry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
<script src="/src/js/include.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        includeHTML({
            headerPlaceHolder: "../include/header.html",
            footerPlaceHolder: "../include/footer.html"
        });

        // La logica per il quiz VR va qui
        const questionsVR = [
            {
                monument: "Colosseo",
                question: "In quale anno fu completato il Colosseo?",
                options: ["80 d.C.", "100 d.C.", "50 d.C."],
                correctAnswer: 0
            }
        ];

        const quizPanel = document.getElementById('quiz-panel');
        const quizQuestion = document.getElementById('quiz-question');
        const quizOptionsVr = document.getElementById('quiz-options-vr');

        // Funzione per mostrare il pannello del quiz
        function showQuizPanel(questionIndex) {
            const question = questionsVR[questionIndex];
            if (!question) return;

            quizQuestion.textContent = question.question;
            quizOptionsVr.innerHTML = '';
            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                optionDiv.textContent = option;
                optionDiv.addEventListener('click', () => {
                    if (index === question.correctAnswer) {
                        alert("Risposta Esatta! 🎉");
                    } else {
                        alert("Risposta Errata! 🙁");
                    }
                    hideQuizPanel();
                });
                quizOptionsVr.appendChild(optionDiv);
            });
            quizPanel.style.display = 'block';
        }

        function hideQuizPanel() {
            quizPanel.style.display = 'none';
        }

        // Event listener per l'hotspot nel mondo VR
        const hotspot = document.getElementById('quiz-hotspot');
        if (hotspot) {
            hotspot.addEventListener('click', function (evt) {
                console.log('Hotspot cliccato!');
                showQuizPanel(0); // Mostra la prima domanda
            });
        }
    });

  </script>
</body>
</html>
