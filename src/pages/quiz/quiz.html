<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Quiz Monumenti di Roma | Lost in Rome</title>

  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link rel="icon" type="image-png" href="/src/resources/images/loghi/logoLostInRome_icona.png">
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
  <link href="/src/plugins/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/src/plugins/slick/slick.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lykmapipo/themify-icons@0.1.2/css/themify-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/src/css/style.css" rel="stylesheet">

  <style>
    :root {
      --turchese: #068D9D;
      --turchese-scuro: #056974;
      --marrone: #6b522a;
      --marrone-chiaro: #7a6a5f;
      --beige: #FFFCF5;
    }

    .quiz-page-body {
      background-color: var(--beige);
      color: #333;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .quiz-main-content {
      padding: 30px 0;
      padding-top: 100px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .quiz-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px;
      text-align: center;
    }

    .quiz-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .quiz-title {
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--marrone);
      margin: 0;
    }

    .vr-icon-link {
      background-color: transparent;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--turchese-scuro);
      transition: all 0.3s ease;
      margin-left: 20px;
      text-decoration: none;
    }

    .vr-icon-link:hover {
      background-color: var(--turchese);
      color: white;
    }

    .vr-icon-link i {
      pointer-events: none;
    }

    .progress-container {
      width: 100%;
      background-color: rgba(6, 141, 157, 0.1);
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 10px;
      background-color: var(--turchese);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .progress-text {
      font-size: 0.9rem;
      color: var(--marrone-chiaro);
      margin-top: 10px;
    }

    .question-counter {
      font-size: 1rem;
      color: var(--marrone-chiaro);
      margin-bottom: 10px;
    }

    .monument-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 8px 32px rgba(107, 82, 42, 0.1);
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--marrone);
      margin-bottom: 30px;
      line-height: 1.4;
    }

    .options-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background-color: white;
      border: 2px solid rgba(6, 141, 157, 0.2);
      border-radius: 8px;
      padding: 15px 20px;
      font-size: 1.1rem;
      color: var(--marrone);
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      display: flex;
      align-items: center;
    }

    .option-btn:hover {
      border-color: var(--turchese);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(6, 141, 157, 0.1);
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background-color: var(--turchese);
      color: white;
      border-radius: 50%;
      margin-right: 15px;
      font-weight: 600;
    }

    .navigation {
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
    }

    .nav-btn {
      background-color: var(--turchese);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      background-color: var(--turchese-scuro);
      transform: translateY(-2px);
    }

    .nav-btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .nav-btn.skip {
      background-color: white;
      color: var(--marrone-chiaro);
      border: 1px solid var(--marrone-chiaro);
    }

    .nav-btn.skip:hover {
      background-color: #f5f5f5;
    }

    .result-container {
      display: none;
      text-align: center;
      padding: 30px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(107, 82, 42, 0.1);
      margin-top: 20px;
    }

    .result-title {
      font-size: 2rem;
      font-weight: 600;
      color: var(--marrone);
      margin-bottom: 20px;
    }

    .result-score {
      font-size: 3rem;
      font-weight: 700;
      color: var(--turchese);
      margin: 20px 0;
    }

    .result-message {
      font-size: 1.2rem;
      color: var(--marrone-chiaro);
      margin-bottom: 30px;
    }

    .feedback-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .feedback-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .feedback-content {
      background-color: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .feedback-overlay.show .feedback-content {
      transform: scale(1);
    }

    .feedback-icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .feedback-text {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .feedback-btn {
      background-color: var(--turchese);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .feedback-btn:hover {
      background-color: var(--turchese-scuro);
      transform: translateY(-2px);
    }

    .correct-feedback {
      color: #27ae60;
    }

    .incorrect-feedback {
      color: #e74c3c;
    }
  </style>
</head>
<body class="quiz-page-body">
<div id="headerPlaceHolder"></div>

<div class="quiz-main-content">
  <div class="quiz-container">
    <div class="quiz-header">
      <h1 class="quiz-title">Quanto conosci la Città Eterna?</h1>
      <a href="quiz_vr.html" class="vr-icon-link" title="Esplora il quiz in Realt&agrave; Virtuale">
        <i class="fas fa-vr-cardboard"></i>
      </a>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
    </div>

    <div id="question-container">
      <div class="question-counter" id="question-counter">Domanda 1 di 10</div>
      <img alt="" class="monument-image" id="monument-image" src="">
      <div class="question-text" id="question-text"></div>

      <div class="options-container" id="options-container">
      </div>

      <div class="navigation">
        <button class="nav-btn skip" id="skip-btn" onclick="skipQuestion()">Salta</button>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()" disabled>Prossima</button>
      </div>
    </div>

    <div class="result-container" id="result-container">
      <h2 class="result-title">Quiz Completato!</h2>
      <div class="result-score" id="result-score">0/10</div>
      <p class="result-message" id="result-message"></p>
      <button class="nav-btn" onclick="restartQuiz()">Riprova</button>
    </div>
  </div>
</div>

<div class="feedback-overlay" id="feedback-overlay">
  <div class="feedback-content">
    <div class="feedback-icon" id="feedback-icon"></div>
    <div class="feedback-text" id="feedback-text"></div>
    <button class="feedback-btn" onclick="hideFeedback()">Continua</button>
  </div>
</div>

<script src="/src/plugins/jQuery/jquery.min.js"></script>
<script src="/src/plugins/bootstrap/bootstrap.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/src/plugins/masonry/masonry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
<script src="/src/js/include.js"></script>

<script>
  const questions = [
    {
      monument: "Colosseo",
      image: "https://images.unsplash.com/photo-1552832230-c0197043d9fe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "In quale anno fu completato il Colosseo?",
      options: [ "80 d.C.", "100 d.C.", "50 d.C." ],
      correctAnswer: 0,
      correctFeedback: "Esatto! Il Colosseo fu completato nell'80 d.C. sotto l'imperatore Tito! 🏛️",
      incorrectFeedback: "Nooo! In realtà fu completato nell'80 d.C. Ci sei andato vicino! 😅"
    },
    {
      monument: "Pantheon",
      image: "https://images.unsplash.com/photo-1593009314325-9527a31d52c2?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Chi ricostruì il Pantheon come lo vediamo oggi?",
      options: [ "Adriano", "Augusto", "Nerone" ],
      correctAnswer: 0,
      correctFeedback: "Giusto! Fu l'imperatore Adriano a ricostruirlo tra il 118 e il 125 d.C.!",
      incorrectFeedback: "Eh no! In realtà fu Adriano. Ma non ti preoccupare, anche gli imperatori si confondevano! 😄"
    },
    {
      monument: "Ara Pacis",
      image: "https://images.unsplash.com/photo-1632961920535-0e97bc113b33?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "A chi è dedicato l'Altare della Pace Augustea?",
      options: [ "Alla dea Pace", "All'imperatore Augusto", "Al dio Marte" ],
      correctAnswer: 1,
      correctFeedback: "Bravo! L'Ara Pacis è dedicata all'imperatore Augusto, che portò pace a Roma dopo anni di guerre! ✨",
      incorrectFeedback: "Quasi! In realtà è dedicata all'imperatore Augusto. Pace e prosperità! 🕊️"
    },
    {
      monument: "Piazza del Popolo",
      image: "https://images.unsplash.com/photo-1577988316128-c49c4064ec2b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Cosa significa 'Popolo' nel nome di Piazza del Popolo?",
      options: [ "Il popolo romano", "I pioppi (piante)", "La chiesa di Santa Maria del Popolo" ],
      correctAnswer: 1,
      correctFeedback: "Esatto! Il nome deriva dai pioppi (populus in latino) che un tempo crescevano nella zona! 🌳",
      incorrectFeedback: "No, in realtà deriva dai pioppi (populus in latino)! Ma ci sta la confusione! 😊"
    },
    {
      monument: "Piazza di Spagna",
      image: "https://images.unsplash.com/photo-1596484552970-4f285ef15d33?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Perché Piazza di Spagna si chiama così?",
      options: [ "Perché vi risiedeva l'ambasciata spagnola", "Perché fu finanziata dal re di Spagna", "Perché ispirata all'architettura spagnola" ],
      correctAnswer: 0,
      correctFeedback: "Giusto! Deve il suo nome al Palazzo di Spagna, sede dell'ambasciata spagnola presso la Santa Sede! 🇪🇸",
      incorrectFeedback: "No, in realtà deve il nome al Palazzo di Spagna, sede dell'ambasciata! Ma ci hai provato! 👍"
    },
    {
      monument: "Piazza Venezia",
      image: "https://images.unsplash.com/photo-1592417817096-5fd75f3d3578?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Quale monumento domina Piazza Venezia?",
      options: [ "Il Vittoriano", "La Colonna Traiana", "Il Campidoglio" ],
      correctAnswer: 0,
      correctFeedback: "Corretto! Il Vittoriano, monumento a Vittorio Emanuele II, domina la piazza! 🏔️",
      incorrectFeedback: "No, in realtà è il Vittoriano! Quella grande 'macchina da scrivere' bianca! 😄"
    },
    {
      monument: "Fontana di Trevi",
      image: "https://images.unsplash.com/photo-1555169061-4cb6f3c06c43?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Cosa si dice porti fortuna fare alla Fontana di Trevi?",
      options: [ "Lanciare una moneta con la mano destra sopra la spalla sinistra", "Bagnarsi i piedi nelle sue acque", "Toccare le statue principali" ],
      correctAnswer: 0,
      correctFeedback: "Esatto! Si dice che lanciare una moneta con la mano destra sopra la spalla sinistra assicuri il ritorno a Roma! 💰",
      incorrectFeedback: "No, in realtà si dice che lanciare una moneta con la mano destra sopra la spalla sinistra porti fortuna! Prova la prossima volta! 😉"
    },
    {
      monument: "Foro Romano",
      image: "https://images.unsplash.com/photo-1574688110028-9c6aade9df58?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Quale era la funzione principale del Foro Romano nell'antichità?",
      options: [ "Centro politico, commerciale e religioso", "Arena per combattimenti entre gladiatori", "Residenza degli imperatori" ],
      correctAnswer: 0,
      correctFeedback: "Perfetto! Il Foro era il centro della vita pubblica romana: politica, commercio e religione! 🏛️",
      incorrectFeedback: "No, in realtà era il centro politico, commerciale e religioso di Roma antica! Quasi! 🤔"
    },
    {
      monument: "Castel Sant'Angelo",
      image: "https://images.unsplash.com/photo-1597843472093-4e4b9f0b1262?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Cosa era originariamente Castel Sant'Angelo?",
      options: [ "Mausoleo dell'imperatore Adriano", "Forte militare", "Palazzo papale" ],
      correctAnswer: 0,
      correctFeedback: "Giusto! Fu costruito come mausoleo para l'imperatore Adriano e la sua famiglia! ⚱️",
      incorrectFeedback: "No, in realtà era originariamente il mausoleo dell'imperatore Adriano! Storia interessante! 📚"
    },
    {
      monument: "Basilica di San Pietro",
      image: "https://images.unsplash.com/photo-1604528112425-6fdd6c0e5b2a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80",
      question: "Sappi che la Basilica di San Pietro sorge sopra...",
      options: [ "Il circo di Nerone e la tomba di San Pietro", "Le terme di Caracalla", "L'antico foro boario" ],
      correctAnswer: 0,
      correctFeedback: "Esatto! La basilica sorge sopra il circo di Nerone, dove San Pietro fu martirizzato! ✝️",
      incorrectFeedback: "No, in realtà sorge sopra il circo di Nerone e la tomba di San Pietro! Curioso, vero? 🤓"
    }
  ];

  let currentQuestion = 0;
  let score = 0;
  let userAnswers = [];
  const feedbackOverlay = document.getElementById('feedback-overlay');
  const feedbackIcon = document.getElementById('feedback-icon');
  const feedbackText = document.getElementById('feedback-text');

  function initQuiz() {
    showQuestion();
    updateProgress();
  }

  function showQuestion() {
    const question = questions[currentQuestion];
    document.getElementById('monument-image').src = question.image;
    document.getElementById('question-text').textContent = question.question;
    document.getElementById('question-counter').textContent = `Domanda ${currentQuestion + 1}/${questions.length}`;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    question.options.forEach((option, index) => {
      const optionElement = document.createElement('button');
      optionElement.className = 'option-btn';
      optionElement.innerHTML = `
        <span class="option-letter">${String.fromCharCode(65 + index)}</span>
        <span>${option}</span>
      `;
      optionElement.addEventListener('click', () => selectOption(index));
      optionsContainer.appendChild(optionElement);
    });

    document.getElementById('next-btn').disabled = true;
  }

  function selectOption(optionIndex) {
    const question = questions[currentQuestion];
    const options = document.querySelectorAll('.option-btn');
    options.forEach(option => {
      option.disabled = true;
    });

    userAnswers[currentQuestion] = optionIndex;

    if (optionIndex === question.correctAnswer) {
      score++;
      options[optionIndex].style.borderColor = '#068D9D';
      options[optionIndex].style.backgroundColor = 'rgba(6, 141, 157, 0.1)';
      showFeedback(true, question.correctFeedback);
    } else {
      options[optionIndex].style.borderColor = '#e74c3c';
      options[optionIndex].style.backgroundColor = 'rgba(231, 76, 60, 0.1)';
      options[question.correctAnswer].style.borderColor = '#068D9D';
      options[question.correctAnswer].style.backgroundColor = 'rgba(6, 141, 157, 0.1)';
      showFeedback(false, question.incorrectFeedback);
    }

    document.getElementById('next-btn').disabled = false;
  }

  function showFeedback(isCorrect, message) {
    feedbackOverlay.className = isCorrect ? 'feedback-overlay show correct-feedback' : 'feedback-overlay show incorrect-feedback';
    feedbackIcon.innerHTML = isCorrect ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-times-circle"></i>';
    feedbackText.textContent = message;
  }

  function hideFeedback() {
    feedbackOverlay.classList.remove('show');
    if (currentQuestion === questions.length - 1) {
      setTimeout(showResults, 300);
    }
  }

  function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
      updateProgress();
    } else {
      showResults();
    }
  }

  function skipQuestion() {
    userAnswers[currentQuestion] = -1;
    nextQuestion();
  }

  function updateProgress() {
    const progress = ((currentQuestion) / questions.length) * 100;
    document.getElementById('progress-bar').style.width = `${progress}%`;
    document.getElementById('progress-text').textContent = `Domanda ${currentQuestion + 1} di ${questions.length}`;
  }

  function showResults() {
    document.getElementById('question-container').style.display = 'none';
    document.getElementById('result-container').style.display = 'block';
    document.getElementById('result-score').textContent = `${score}/${questions.length}`;

    let message = "";
    if (score === questions.length) {
      message = "Complimenti! Sei un vero esperto di Roma! Meriti una laurea honoris causa in Storia Romana! 🏆";
    } else if (score >= questions.length * 0.7) {
      message = "Ottimo risultato! La tua conoscenza di Roma è impressionante! I gladiatori sarebbero fieri di te! 🌟";
    } else if (score >= questions.length * 0.5) {
      message = "Buon risultato! Conosci Roma meglio della maggior parte dei turisti! Continua così! 👍";
    } else {
      message = "C'è ancora tanto da scoprire su Roma! Ma non ti preoccupare, anche Roma non fu costruita in un giorno! 🗺️";
    }

    document.getElementById('result-message').textContent = message;
  }

  function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    userAnswers = [];
    document.getElementById('question-container').style.display = 'block';
    document.getElementById('result-container').style.display = 'none';
    initQuiz();
  }

  document.addEventListener('DOMContentLoaded', function() {
    initQuiz();
  });
</script>
<div id="footerPlaceHolder"></div>
<script>
  document.addEventListener("DOMContentLoaded", function() {
      includeHTML({
          headerPlaceHolder: "../include/header.html",
          footerPlaceHolder: "../include/footer.html"
      });
  });
</script>
</body>
</html>
